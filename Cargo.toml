[workspace]
resolver = "2"
members = ["crates/abode-core", "crates/abode-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
uuid = { version = "1", features = ["v4", "v7", "serde"] }

[profile.dev.package."*"]
# Dependencies (egui, sqlite, image decoding) are much faster with optimisations,
# and they rarely change, so this keeps debug builds snappy.
opt-level = 2
