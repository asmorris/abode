[workspace]
resolver = "2"
members = ["crates/abode-core", "crates/abode-app"]

[workspace.package]
version = "0.1.5"
edition = "2024"
rust-version = "1.92"

[workspace.lints.clippy]
# Since Rust 1.88 this suggests turning nested `if let`s into let chains; the
# nesting reads fine, so it's not worth the churn.
collapsible_if = "allow"

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp", "ico"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
tempfile = "3"
thiserror = "2"
uuid = { version = "1", features = ["v4", "v7", "serde"] }

[profile.dev.package."*"]
# Dependencies (egui, sqlite, image decoding) are much faster with optimisations,
# and they rarely change, so this keeps debug builds snappy.
opt-level = 2
