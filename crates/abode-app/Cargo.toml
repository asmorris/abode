[package]
name = "abode-app"
description = "Abode desktop app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "abode"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
abode-core = { path = "../abode-core" }
anyhow.workspace = true
chrono.workspace = true
image.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
eframe = { version = "0.31", features = ["persistence"] }
egui-phosphor = "0.9"
open = "5"
rfd = "0.15"
ureq = "2"
dirs = "5"

# Reading the system's high contrast setting.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSAccessibility", "NSWorkspace"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_UI_Accessibility", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
